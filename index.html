<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>App Profiler</title>
<!-- nbinding design system (a copy lives in ds/): fonts, colour tokens, light and dark themes, buttons, fields, dialogs, toast -->
<link rel="stylesheet" href="ds/nb.css">
<style>
/* App Profiler on the nbinding design system. Tokens only: product brand colours are the user's data and stay as they are. */
:root{
  /* The canvas sits behind the cards in light; in dark the cards lift off the canvas instead. */
  --ap-canvas:light-dark(var(--nb-panel),var(--nb-surface));
  --ap-card:light-dark(var(--nb-surface),var(--nb-panel));
  --ap-chip:light-dark(var(--nb-panel),var(--nb-line));
  --ap-well:light-dark(var(--nb-panel),var(--nb-field));
  --ap-shadow:0 3px 12px rgb(0 0 0 / .07);
}
html,body{height:100%;overflow:hidden}
body{background:var(--ap-canvas);user-select:none}
*{scrollbar-width:thin;scrollbar-color:var(--nb-line) transparent}
@keyframes apFade{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

.ap-stage{position:fixed;inset:0;overflow:hidden;background:var(--ap-canvas)}
.ap-toolbar{position:absolute;top:14px;left:16px;right:16px;display:flex;align-items:center;gap:10px;pointer-events:none}
.ap-panel{pointer-events:auto;display:flex;align-items:center;gap:6px;padding:4px;border-radius:var(--nb-radius-md);background:var(--nb-surface);box-shadow:0 0 0 1px var(--nb-line),var(--ap-shadow)}
.ap-panel--title{gap:10px;padding:4px 8px 4px 12px}
.ap-brand{min-height:40px;font-size:1.05rem}
.ap-brand .nb-brand__mark{width:24px;height:24px}
.ap-divider{width:1px;height:18px;background:var(--nb-line)}
.ap-dirty{display:none;width:8px;height:8px;border-radius:50%;background:var(--nb-ink)}
.ap-filename{font-size:var(--nb-text-xs);color:var(--nb-muted)}
.ap-tool{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:36px;min-height:40px;padding:0 10px;border:0;border-radius:var(--nb-radius-sm);background:none;color:var(--nb-ink);font-size:var(--nb-text-sm);font-weight:600}
.ap-tool:hover,.ap-tool[aria-expanded="true"]{background:var(--ap-chip)}
.ap-tool--quiet{font-weight:500;color:var(--nb-muted)}
.ap-tool--num{min-width:56px;font-variant-numeric:tabular-nums}
.ap-kbd{font:600 10.5px var(--nb-font-mono);padding:2px 5px;border-radius:5px;background:var(--ap-chip);color:var(--nb-muted)}
.ap-primary{min-height:48px;padding:8px 16px;border-radius:var(--nb-radius-md);font-size:var(--nb-text-sm);pointer-events:auto;box-shadow:var(--ap-shadow)}
.ap-primary .ap-kbd{background:color-mix(in srgb,var(--nb-accent-ink) 20%,transparent);color:inherit}
.ap-seg{flex-wrap:nowrap;padding:0;background:none}
.ap-seg>button{min-height:40px;padding:0 14px}
.ap-zoom{position:absolute;left:16px;bottom:16px}
.ap-hint{position:absolute;right:16px;bottom:16px;font-size:var(--nb-text-xs);color:var(--nb-muted);pointer-events:none}

/* Menus (File, image slot) */
.ap-menu{width:220px;padding:5px;border-radius:var(--nb-radius-md);background:var(--nb-surface);box-shadow:0 0 0 1px var(--nb-line),0 12px 34px rgb(0 0 0 / .18);animation:apFade .12s ease}
.ap-menu--file{display:none;position:absolute;top:46px;left:0;z-index:40}
.ap-menu--slot{position:fixed;width:184px;z-index:60}
.ap-menu__item{display:flex;align-items:center;width:100%;min-height:36px;padding:7px 10px;border:0;border-radius:var(--nb-radius-sm);background:none;color:var(--nb-ink);font-size:var(--nb-text-sm);text-align:left}
.ap-menu__item:hover{background:var(--ap-chip)}
.ap-menu__item--danger{color:var(--nb-error)}
.ap-menu__item span:first-child{flex:1}

/* Board */
#world{transform-origin:0 0;display:flex;gap:30px;padding:100px 72px 84px;width:max-content;align-items:flex-start}
.gutter-detail,.col-detail{display:flex}
#world.zoomed-out .gutter-detail,#world.zoomed-out .col-detail{display:none}
.ap-gutter{width:132px;flex:none;display:flex;flex-direction:column;gap:14px;padding-top:2px}
.ap-gutter__label{box-sizing:border-box;padding-top:10px;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--nb-muted);text-align:right}
.ap-col{width:360px;flex:none;display:flex;flex-direction:column;gap:14px}
.ap-card{box-sizing:border-box;display:flex;flex-direction:column;gap:5px;padding:11px 14px;overflow:hidden;border-radius:var(--nb-radius-md);background:var(--ap-card);box-shadow:0 0 0 1px var(--nb-line)}
.ap-card--head{height:136px;gap:7px;padding:11px 12px;border-radius:var(--nb-radius-lg);box-shadow:0 0 0 1px var(--nb-line),var(--ap-shadow)}
.ap-card__top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ap-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--nb-muted)}
.ap-avatar{display:flex;align-items:center;justify-content:center;flex:none;color:#fff;font-family:var(--nb-font-display);font-weight:700}
/* Inputs that read as text until you edit them; an underline shows where the cursor is */
.ap-bare{width:100%;min-width:0;padding:0;border:0;background:none;outline:none;color:var(--nb-ink)}
.ap-bare:focus-visible{box-shadow:0 1.5px 0 var(--nb-ring)}
.ap-bare::placeholder{color:var(--nb-faint)}
textarea.ap-bare{flex:1;resize:none}
.ap-name{flex:1;font-family:var(--nb-font-display);font-weight:var(--nb-weight-display);font-size:17px;letter-spacing:-.01em}
.ap-tagline{font-size:12.5px;font-weight:500;color:var(--nb-muted)}
.ap-mono{font-family:var(--nb-font-mono)}
.ap-well{padding:4px 6px;border:0;border-radius:var(--nb-radius-sm);background:var(--ap-well);color:var(--nb-ink);outline:none}
.ap-well:focus-visible{outline:2px solid var(--nb-ring);outline-offset:1px}
.ap-chips{display:flex;gap:5px;flex-wrap:wrap;align-content:flex-start;overflow-y:auto;flex:1}
.ap-chip{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:var(--nb-radius-pill);background:var(--ap-chip);color:var(--nb-ink);font-size:11px;font-weight:600;white-space:nowrap;flex:none}
.ap-chip--outline{background:none;box-shadow:inset 0 0 0 1px var(--nb-faint)}
.ap-chip-input{min-width:56px;padding:3px 0;font-size:11.5px;font-weight:500}
.ap-x{padding:0 3px;border:0;background:none;color:var(--nb-muted);font-size:12px;line-height:1}
.ap-x:hover{color:var(--nb-error)}
.ap-mini{padding:2px 4px;border:0;border-radius:5px;background:none;color:var(--nb-muted);font-size:12px;line-height:1.2}
.ap-mini:hover{background:var(--ap-chip);color:var(--nb-ink)}
.ap-mini--danger:hover{background:color-mix(in srgb,var(--nb-error) 14%,transparent);color:var(--nb-error)}
.ap-link{padding:0;border:0;background:none;color:var(--nb-ink);font-size:11px;font-weight:600;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--nb-faint)}
.ap-link:hover{text-decoration-color:currentColor}
/* Character counters: past 85% they turn bold, past the limit they turn the error colour and get a wavy underline */
.ap-count{font:600 10.5px var(--nb-font-mono);color:var(--nb-muted)}
.ap-count--near{color:var(--nb-ink);font-weight:800}
.ap-count--over{color:var(--nb-error);font-weight:800;text-decoration:underline wavy}
.ap-dashed{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--nb-line);background:none;color:var(--nb-muted);font-weight:600}
.ap-dashed:hover{border-color:var(--nb-faint);color:var(--nb-ink)}
.ap-add-col{width:200px;height:136px;flex:none;box-sizing:border-box;padding:22px 16px;border-radius:var(--nb-radius-lg);background:color-mix(in srgb,var(--ap-card) 60%,transparent);font-family:var(--nb-font-display);font-size:14px}
.ap-swatch{display:flex;align-items:center;gap:4px;padding:3px 5px 3px 4px;border-radius:var(--nb-radius-sm);background:var(--ap-well)}
.ap-swatch input[type=color]{width:22px;height:22px;padding:0;border:0;border-radius:5px;background:none;cursor:pointer}
.ap-shot-del{position:absolute;top:5px;right:5px;z-index:3;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border:0;border-radius:50%;background:var(--nb-accent);color:var(--nb-accent-ink);font-size:10px;line-height:1;box-shadow:0 1px 5px rgb(0 0 0 / .35)}
.slot{background-size:cover;background-position:center;cursor:pointer;display:flex;align-items:center;justify-content:center;box-sizing:border-box;font-size:11px;font-weight:600;color:var(--nb-muted)}
.slot.empty{border:1.5px dashed var(--nb-line);background-color:var(--ap-well)}
.slot:hover{outline:2px solid var(--nb-ring);outline-offset:1px}
#world.view-mode input,#world.view-mode textarea,#world.view-mode select,#world.view-mode .brand-color{pointer-events:none}
#world.view-mode .edit-only{display:none!important}

/* Dialogs: native <dialog> (focus stays inside, Escape closes, focus returns) in the system's dialog style */
.ap-dialog{position:fixed;inset:auto;left:50%;top:14vh;transform:none;translate:-50% 0;margin:0;border:0;animation:apFade .14s ease}
.ap-dialog::backdrop{background:var(--nb-scrim)}
.ap-dialog--search{padding:0;overflow:hidden}
.ap-search-input{min-height:56px;border-radius:0;box-shadow:inset 0 -1px 0 var(--nb-line);background:none;font-weight:600}
.ap-results{max-height:320px;overflow-y:auto;padding:6px}
.ap-result{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:var(--nb-radius-sm);background:none;color:var(--nb-ink);text-align:left}
.ap-result:hover,.ap-result:focus-visible{background:var(--ap-chip)}
.ap-result__main{flex:1;min-width:0}
.ap-result__main strong,.ap-result__main small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-result__main strong{font-family:var(--nb-font-display);font-weight:700;font-size:var(--nb-text-sm)}
.ap-result__main small{font-size:var(--nb-text-xs);color:var(--nb-muted)}
.ap-result__type{flex:none;padding:2.5px 7px;border-radius:5px;background:var(--ap-chip);font-size:10.5px;font-weight:600}
.ap-empty{padding:18px;font-size:var(--nb-text-sm);color:var(--nb-muted);text-align:center}

/* Lightbox (View mode): always dark, whatever the theme */
.ap-lightbox{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 40px;box-sizing:border-box;background:color-mix(in srgb,var(--nb-surface) 90%,transparent);color:var(--nb-ink);animation:apFade .14s ease}
.ap-lightbox__close{position:fixed;top:20px;right:24px;min-height:44px;padding:8px 16px;font-size:var(--nb-text-sm)}
.ap-lightbox__row{display:flex;gap:20px;overflow-x:auto;max-width:100%;padding:6px 2px;align-items:flex-start}
.ap-lightbox figure{flex:none;display:flex;flex-direction:column;align-items:center;gap:9px}
.ap-lightbox img{max-height:70vh;max-width:82vw;border-radius:var(--nb-radius-lg);background:#fff;box-shadow:0 20px 50px rgb(0 0 0 / .45)}
.ap-lightbox figcaption{font-size:var(--nb-text-xs);color:var(--nb-muted)}
</style>
</head>
<body>
<div class="ap-stage">
  <div id="canvas" style="position:absolute;inset:0">
    <div id="world"></div>
  </div>

  <!-- top toolbar -->
  <div data-nopan="1" class="ap-toolbar">
    <div class="ap-panel ap-panel--title">
      <span class="nb-brand ap-brand"><svg class="nb-brand__mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="7" fill="currentColor"/><path d="M7 19 19 7M7 13l6-6M13 19l6-6" stroke="var(--nb-surface)" stroke-width="1.6" stroke-linecap="round"/><path d="M7 7l12 12M13 7l6 6M7 13l6 6" stroke="var(--nb-surface)" stroke-width="1.6" stroke-linecap="round" opacity=".45"/></svg>App Profiler</span>
      <span id="dirtydot" class="ap-dirty" title="Unsaved changes"><span class="nb-sr-only">Unsaved changes</span></span>
      <div class="ap-divider"></div>
      <div style="position:relative">
        <button id="filebtn" data-act="fileMenu" class="ap-tool" aria-haspopup="menu" aria-expanded="false" aria-controls="filemenu">File</button>
        <div id="filemenu" class="ap-menu ap-menu--file" role="menu"></div>
      </div>
      <div id="fileName" class="ap-filename"></div>
    </div>
    <span style="flex:1"></span>
    <div class="ap-panel">
      <div class="nb-segmented ap-seg" role="group" aria-label="Mode">
        <button id="modeEdit" data-act="mode" data-mode="edit" aria-pressed="true">Edit</button>
        <button id="modeView" data-act="mode" data-mode="view" aria-pressed="false">View</button>
      </div>
      <div class="ap-divider"></div>
      <button data-act="openSearch" class="ap-tool ap-tool--quiet"><span>Search</span><span class="ap-kbd">⌘K</span></button>
    </div>
    <button data-act="quickAdd" class="nb-button ap-primary">+ New product <span class="ap-kbd">N</span></button>
  </div>

  <!-- zoom controls -->
  <div data-nopan="1" class="ap-panel ap-zoom">
    <button data-act="zoomOut" class="ap-tool" aria-label="Zoom out">−</button>
    <button id="zoompct" data-act="zoomFit" title="Zoom to fit" class="ap-tool ap-tool--num">80%</button>
    <button data-act="zoomIn" class="ap-tool" aria-label="Zoom in">+</button>
    <div class="ap-divider"></div>
    <button data-act="zoomFit" class="ap-tool">Fit</button>
  </div>
  <div class="ap-hint">Scroll to pan · ⌘/Ctrl-scroll to zoom · zoom out for overview</div>

  <!-- overlays mount here -->
  <div id="overlays"></div>
  <div id="toast" class="nb-toast" role="status"></div>
</div>

<input id="filepick" type="file" accept="image/*" style="display:none">
<input id="openpick" type="file" accept=".appboard,.json,application/json" style="display:none">
<script>
const FORMAT_VERSION = 2;
const GUTTER = [
  {label:'Identity',h:136,detail:false},
  {label:'Identifiers',h:92},{label:'Short copy',h:82},{label:'Medium copy',h:104},
  {label:'Long copy',h:210},{label:'Screenshots',h:272},{label:'Icon & brand',h:156},
  {label:'Privacy',h:108},{label:'Permissions',h:108},{label:'Pricing',h:104},
  {label:'Devices / platforms',h:96},{label:'Keywords',h:104},{label:'Links',h:136},{label:'Notes',h:128}
];

const state = { cols: seed(), scale:.8, panX:0, panY:0, dirty:false, mode:'edit' };
let lightboxEl=null, slotMenuEl=null;
let fileHandle = null, loaded = false, saveT=null, toastT=null, spaceDown=false, slotTarget=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function typeMeta(t){
  return ({
    mobile:{label:'Mobile app',accent:'#4C7DE8',ids1:'Package name (Android)',ids2:'Bundle id (iOS)',short:['App Store subtitle',30],mid:['Play short description',80],long:'Store description',shots:['Store screenshots · 6.7″',104,200,'Screenshot'],privacy:'Privacy nutrition labels',perms:'Permissions',devices:'Supported devices'},
    saas:{label:'SaaS',accent:'#2E9E8F',ids1:'Primary domain',ids2:'App subdomain',short:['Meta / SEO title',60],mid:['Meta description',160],long:'Landing page copy',shots:['Product screenshots · web',176,116,'Web shot'],privacy:'Data & compliance',perms:'OAuth scopes & integrations',devices:'Supported browsers'},
    service:{label:'Custom / service',accent:'#9B59D0',ids1:'Codename / SKU',ids2:'Client',short:['One-liner',80],mid:['Elevator pitch',160],long:'Scope & deliverables',shots:['Portfolio images',144,144,'Image'],privacy:'Data handling',perms:'Access requirements',devices:'Delivery platforms'}
  })[t] || typeMeta('mobile');
}
function blank(id,name,type){
  return {id,type,appName:name,appNameAlts:[],tagline:'',idsPrimary:'',idsSecondary:'',shortDesc:'',midDesc:'',longDesc:'',shots:[id+'-s1',id+'-s2',id+'-s3'],privacy:[],permissions:[],pricingModel:type==='service'?'Retainer':type==='saas'?'Tiered SaaS':'Freemium',pricingDetail:'',devices:[],keywords:[],urls:[],brandColors:[typeMeta(type).accent],notes:'',images:{}};
}
function seed(){
  const b=(id,name,type,o)=>Object.assign(blank(id,name,type),o);
  return [
    b('sip','Sipster','mobile',{tagline:'Hydration tracking without the nagging',idsPrimary:'com.forgeline.sipster',idsSecondary:'com.forgeline.sipster.ios',shortDesc:'Hydration without nagging',midDesc:'Smart, weather-aware water reminders with widgets. Private, offline-first, no account.',longDesc:'Sipster learns your routine and the local weather to nudge you at the right moments — not every hour on the hour. Log a glass in one tap from the widget or watch, see gentle weekly trends, and keep every drop of data on your device. No account, no ads, no guilt trips.',privacy:['Health & Fitness — on device','Coarse location (weather)','No identifiers collected'],permissions:['Notifications','HealthKit — write water','Location — while using'],pricingModel:'Freemium',pricingDetail:'Free core · Sipster+ $14.99/yr (themes, trends)',devices:['iPhone','iPad','Apple Watch','Android 10+'],keywords:['water tracker','hydration','health','reminder','widget'],urls:[{label:'App Store',url:'https://apps.apple.com/app/sipster'},{label:'Website',url:'https://sipster.app'}],brandColors:['#4C7DE8','#8FD0F0'],appNameAlts:['Dripp','Waterlog'],notes:'ASO experiment: lead with “no nagging” angle vs. streaks.'}),
    b('hex','Hexbound','mobile',{tagline:'A calm hex puzzle, 5 minutes a day',idsPrimary:'games.hexbound.daily',idsSecondary:'games.hexbound.daily.ios',shortDesc:'Calm daily hex logic puzzle',midDesc:'One handcrafted hex logic puzzle a day. Shareable results, streaks, no mid-game ads.',longDesc:'Every day at midnight a new handcrafted hexagonal logic puzzle appears. Solve it in a few quiet minutes, share your result grid, and keep your streak alive. Difficulty ramps gently through the week — Monday is a warm-up, Sunday is a beast.',privacy:['No data collected','Analytics — opt-in only'],permissions:['Notifications — daily puzzle'],pricingModel:'IAP',pricingDetail:'$2.99 remove ads · $9.99 archive & packs',devices:['iPhone','Android','Web'],keywords:['puzzle','daily game','logic','hex','casual'],urls:[{label:'Website',url:'https://hexbound.games'}],brandColors:['#9B59D0','#E8543F'],appNameAlts:['Hexile','Sixfold'],notes:''}),
    b('fml','Formlet','saas',{tagline:'A form backend in one endpoint',idsPrimary:'formlet.io',idsSecondary:'app.formlet.io',shortDesc:'Formlet — Form Backend for Static Sites',midDesc:'Add working forms to any static site with one endpoint. Spam filtering, notifications, webhooks and CSV export included. Free tier.',longDesc:'Point any HTML form at your Formlet endpoint and you’re done: submissions land in a clean dashboard with spam filtering, email and Slack notifications, webhooks, and one-click CSV export. Built for Jamstack sites, portfolios and landing pages that don’t want a server.',privacy:['GDPR DPA available','EU data residency','SOC 2 — planned'],permissions:['Zapier','Webhooks','Slack','Google Sheets export'],pricingModel:'Tiered SaaS',pricingDetail:'Free 50 subs/mo · Pro $9 · Team $29',devices:['Chrome','Firefox','Safari','Edge'],keywords:['forms','static sites','jamstack','form backend'],urls:[{label:'Website',url:'https://formlet.io'},{label:'Docs',url:'https://docs.formlet.io'}],brandColors:['#E8543F','#8C2417'],notes:'Landing page A/B: “one endpoint” vs “forms without a server”.'}),
    b('atk','Atlas Kiosk','service',{tagline:'Interactive wayfinding kiosks for Harbor Museum',idsPrimary:'ATLAS-KSK-01',idsSecondary:'Harbor Museum',shortDesc:'Touch wayfinding & exhibit kiosks',midDesc:'Design, build and maintenance of touch wayfinding and exhibit-info kiosks with an offline-first CMS the museum staff edit themselves.',longDesc:'Scope: 6 × 32″ lobby kiosks + docent iPad app. Wayfinding with live floor status, exhibit deep-dives, four languages. Offline-first CMS on museum LAN; staff edit content without us. Includes hardware spec, install, and a 12-month maintenance retainer.',privacy:['On-prem only','No visitor PII stored','Anonymous usage counts'],permissions:['Museum LAN access','CMS admin accounts','Loading dock (install)'],pricingModel:'Retainer',pricingDetail:'Build fixed-bid · $3.5k/mo maintenance',devices:['32″ touch kiosk','iPad docent app','Admin web CMS'],keywords:['kiosk','wayfinding','museum','CMS'],urls:[{label:'Proposal',url:'https://forgeline.studio/atlas'}],brandColors:['#2E9E8F','#134E48'],notes:'Renewal conversation due Oct. Candidate to productize as “Atlas”.'})
  ];
}
const PRICING=['Free','Freemium','Paid upfront','Subscription','IAP','Tiered SaaS','Retainer','Fixed bid','Hourly'];
const TYPES={mobile:'Mobile app',saas:'SaaS',service:'Custom / service'};

// ---------- persistence (IndexedDB autosave, crash safety) ----------
let idbP;
function idb(){ if(idbP) return idbP; idbP=new Promise((res,rej)=>{const r=indexedDB.open('app-profiler-proto',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}); return idbP; }
async function loadSaved(){
  try{ const db=await idb(); const data=await new Promise(res=>{const t=db.transaction('kv').objectStore('kv').get('matrix-v2');t.onsuccess=()=>res(t.result);t.onerror=()=>res(null);});
    if(data&&data.cols){ state.cols=data.cols.map(c=>Object.assign({images:{}},c)); } }catch(e){}
  loaded=true; renderCols(); setTimeout(zoomFit,80);
}
function persist(){ if(!loaded) return; clearTimeout(saveT); saveT=setTimeout(async()=>{ try{const db=await idb(); db.transaction('kv','readwrite').objectStore('kv').put({cols:state.cols},'matrix-v2');}catch(e){} },300); }
function markDirty(){ state.dirty=true; document.getElementById('dirtydot').style.display='inline-block'; }

// ---------- mutation ----------
function col(id){ return state.cols.find(c=>c.id===id); }
function mut(){ persist(); markDirty(); }
function updateCol(id,patch){ Object.assign(col(id),patch); mut(); }

// ---------- rendering ----------
// Counter state: past 85% of the limit it's "near", past the limit "over" (shown by weight and a wavy underline, not colour alone)
function cnt(v,max){ const n=(v||'').length; return {n,cls:'ap-count'+(n>max?' ap-count--over':n>max*0.85?' ap-count--near':'')}; }
function iconBg(c){ return 'linear-gradient(135deg,'+(c.brandColors[0]||'#4C7DE8')+','+(c.brandColors[1]||c.brandColors[0]||'#2E3A59')+')'; }
function slotStyle(id,sid,w,h,r){ const src=(col(id).images||{})[sid]; return 'width:'+w+'px;height:'+h+'px;border-radius:'+r+'px;flex:none;'+(src?('background-image:url('+esc(src)+')'):''); }
function slotHTML(id,sid,w,h,r,ph,isIcon){ const src=(col(id).images||{})[sid]; return '<div class="slot '+(src?'':'empty')+'" data-act="slotClick" data-col="'+id+'" data-sid="'+sid+'"'+(isIcon?' data-icon="1"':'')+' style="'+slotStyle(id,sid,w,h,r)+'">'+(src?'':esc(ph))+'</div>'; }
function card(h,extra,inner){ return '<div class="col-detail ap-card" style="height:'+h+'px;'+(extra||'')+'">'+inner+'</div>'; }
function counter(field,v,max){ const r=cnt(v,max); return '<span data-count="'+field+'" data-max="'+max+'" class="'+r.cls+'">'+r.n+'/'+max+'</span>'; }

function chipRow(id,field,list,outline){
  return list.map((ch,i)=>'<span class="ap-chip'+(outline?' ap-chip--outline':'')+'">'+esc(ch)+'<button class="ap-x edit-only" data-act="chipRemove" data-col="'+id+'" data-field="'+field+'" data-idx="'+i+'" aria-label="Remove '+esc(ch)+'">×</button></span>').join('')
    +'<input class="edit-only ap-bare ap-chip-input" data-act="chipAdd" data-col="'+id+'" data-field="'+field+'" placeholder="+ add ⏎" aria-label="Add to '+esc(field)+'">';
}
function chipCard(id,label,field,list,h,outline){
  return card(h,'gap:6px','<div class="ap-label">'+esc(label)+'</div><div class="ap-chips">'+chipRow(id,field,list,outline)+'</div>');
}

function gutterHTML(){

  h+='<div class="gutter-detail" style="flex-direction:column;gap:14px">';

  h+='</div></div>';
  return h;

function renderCols(){
  const world=document.getElementById('world');
  world.innerHTML=gutterHTML()
    +state.cols.map(colHTML).join('')
    +'<button class="edit-only ap-dashed ap-add-col" data-nopan="1" data-act="quickAdd">+ New product column</button>';
  document.getElementById('fileName').textContent=state.cols.length+' product profiles';
  applyView();
}


// ---------- canvas view ----------
function applyView(){
  const s=state, world=document.getElementById('world'), canvas=document.getElementById('canvas');
  world.style.transform='translate('+s.panX+'px,'+s.panY+'px) scale('+s.scale+')';
  world.classList.toggle('zoomed-out',s.scale<0.45);
  world.classList.toggle('view-mode',s.mode==='view');
  canvas.style.backgroundImage=s.scale?'radial-gradient(circle, var(--nb-line) 1.1px, transparent 1.3px)':'none';
  canvas.style.backgroundSize=(26*s.scale)+'px '+(26*s.scale)+'px';
  canvas.style.backgroundPosition=s.panX+'px '+s.panY+'px';
  document.getElementById('zoompct').textContent=Math.round(s.scale*100)+'%';
}
function zoomAt(cx,cy,factor){ const s=state; const ns=Math.min(2,Math.max(0.12,s.scale*factor)); const k=ns/s.scale; s.panX=cx-(cx-s.panX)*k; s.panY=cy-(cy-s.panY)*k; s.scale=ns; applyView(); }
function zoomFit(){
  const w=document.getElementById('world'), c=document.getElementById('canvas');
  if(!w||!c) return; const cw=c.clientWidth, ww=w.offsetWidth, wh=w.offsetHeight;
  const scale=Math.max(0.46,Math.min((cw-60)/ww,1));
  state.scale=scale; state.panX=ww*scale<=cw?(cw-ww*scale)/2:20;
  state.panY=wh*scale<=c.clientHeight?Math.max(10,(c.clientHeight-wh*scale)/2):66-90*scale;
  applyView();
}
function jumpTo(colId){
  setTimeout(()=>{ const el=document.querySelector('[data-col-id="'+colId+'"]'), c=document.getElementById('canvas'); if(!el||!c) return;
    const r=el.getBoundingClientRect(), cr=c.getBoundingClientRect(), s=state.scale;
    const wx=(r.left-cr.left-state.panX)/s, wy=(r.top-cr.top-state.panY)/s, ww=r.width/s, ns=0.85;
    state.scale=ns; state.panX=c.clientWidth/2-(wx+ww/2)*ns; state.panY=100-wy*ns; applyView();
  },30);
}
function toast(msg){ clearTimeout(toastT); const t=document.getElementById('toast'); t.textContent=msg; t.dataset.show='true'; toastT=setTimeout(()=>{ t.dataset.show='false'; },2200); }

// ---------- edit / view mode ----------
function setMode(m){ state.mode=m; closeSlotMenu(); renderCols(); updateModeUI(); }
function updateModeUI(){ ['Edit','View'].forEach(m=>{ const b=document.getElementById('mode'+m); if(!b)return; b.setAttribute('aria-pressed',String(state.mode===m.toLowerCase())); }); }

// ---------- slot action menu (edit) ----------
function closeSlotMenu(){ if(slotMenuEl){ slotMenuEl.remove(); slotMenuEl=null; } }
function openSlotMenu(x,y,id,sid,isIcon){
  closeSlotMenu();
  const filled=(col(id).images||{})[sid];
  const items=[['slotReplace','Replace image…']];
  if(filled) items.push(['slotRemoveImg','Remove image']);
  if(!isIcon){ items.push(['slotAddSlot','+ Add slot']); items.push(['slotDelSlot','Delete slot']); }
  const el=document.createElement('div'); el.id='slotMenu'; el.className='ap-menu ap-menu--slot'; el.setAttribute('role','menu');
  el.style.left=Math.min(x,window.innerWidth-196)+'px'; el.style.top=Math.min(y,window.innerHeight-180)+'px';
  el.innerHTML=items.map(([a,label])=>'<button role="menuitem" data-act="'+a+'" data-col="'+id+'" data-sid="'+sid+'" class="ap-menu__item'+(a==='slotDelSlot'?' ap-menu__item--danger':'')+'">'+label+'</button>').join('');
  document.body.appendChild(el); slotMenuEl=el;
}

// ---------- asset lightbox (view) ----------
function closeLightbox(){ if(lightboxEl){ lightboxEl.remove(); lightboxEl=null; } }
function openLightbox(id){
  closeLightbox(); const c=col(id), im=c.images||{}, imgs=[];
  if(im[c.id+'-icon']) imgs.push({src:im[c.id+'-icon'],label:'App icon'});
  c.shots.forEach((sid,i)=>{ if(im[sid]) imgs.push({src:im[sid],label:'Screenshot '+(i+1)}); });
  const el=document.createElement('div'); el.id='lightbox'; el.className='ap-lightbox nb-dark';
  el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label',(c.appName||'Product')+' assets');
  el.onclick=(ev)=>{ if(ev.target===el) closeLightbox(); };
  const head='<h2 class="nb-h2" style="margin-bottom:18px">'+esc(c.appName)+' · assets</h2>';
  const body=imgs.length
    ? '<div class="ap-lightbox__row">'+imgs.map(g=>'<figure><img src="'+esc(g.src)+'" alt="'+esc(g.label)+'"><figcaption>'+esc(g.label)+'</figcaption></figure>').join('')+'</div>'
    : '<p class="nb-lead">No assets added yet — switch to Edit mode to add screenshots or an icon.</p>';
  el.innerHTML='<button data-act="closeLightbox" class="nb-button nb-button--secondary ap-lightbox__close">Close ✕</button>'+head+body;
  document.body.appendChild(el); lightboxEl=el; el.querySelector('button').focus();
}

// ---------- file operations (.appboard = self-contained JSON w/ embedded images) ----------
function boardData(){ return {formatVersion:FORMAT_VERSION,savedAt:new Date().toISOString(),cols:state.cols}; }
function loadBoard(obj){ const cols=Array.isArray(obj)?obj:obj.cols; if(!cols) throw new Error('No board data'); state.cols=cols.map(c=>Object.assign({images:{}},c)); state.dirty=false; document.getElementById('dirtydot').style.display='none'; renderCols(); setTimeout(zoomFit,60); }
function downloadBlob(name,text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
async function saveAs(){
  const text=JSON.stringify(boardData(),null,2);
  if(window.showSaveFilePicker){
    try{ fileHandle=await showSaveFilePicker({suggestedName:'portfolio.appboard',types:[{description:'App Profiler board',accept:{'application/json':['.appboard','.json']}}]});
      const w=await fileHandle.createWritable(); await w.write(text); await w.close();
      state.dirty=false; document.getElementById('dirtydot').style.display='none';
      document.getElementById('fileName').textContent=fileHandle.name; toast('Saved '+fileHandle.name);
    }catch(e){ if(e.name!=='AbortError') toast('Save cancelled'); }
  }else{ downloadBlob('portfolio.appboard',text); state.dirty=false; document.getElementById('dirtydot').style.display='none'; toast('Downloaded portfolio.appboard'); }
}
async function save(){
  if(fileHandle){ try{ const w=await fileHandle.createWritable(); await w.write(JSON.stringify(boardData(),null,2)); await w.close(); state.dirty=false; document.getElementById('dirtydot').style.display='none'; toast('Saved '+fileHandle.name); return; }catch(e){} }
  saveAs();
}
async function openFile(){
  if(window.showOpenFilePicker){
    try{ const [h]=await showOpenFilePicker({types:[{description:'App Profiler board',accept:{'application/json':['.appboard','.json']}}]});
      const f=await h.getFile(); loadBoard(JSON.parse(await f.text())); fileHandle=h; document.getElementById('fileName').textContent=h.name; toast('Opened '+h.name);
    }catch(e){ if(e.name!=='AbortError') toast('Could not open file'); }
  }else{ document.getElementById('openpick').click(); }
}
function exportJSON(){ downloadBlob('portfolio.json',JSON.stringify({formatVersion:FORMAT_VERSION,cols:state.cols.map(c=>{const {images,...rest}=c;return rest;})},null,2)); toast('Exported portfolio.json (no images)'); }

const FILE_ITEMS=[
  {label:'Save',kbd:'⌘S',fn:save},{label:'Save As…',kbd:'⇧⌘S',fn:saveAs},{label:'Open / Import…',kbd:'⌘O',fn:openFile},
  {label:'Export JSON',kbd:'',fn:exportJSON},{label:'Export .appboard',kbd:'',fn:saveAs}
];
function renderFileMenu(){ document.getElementById('filemenu').innerHTML=FILE_ITEMS.map((f,i)=>'<button role="menuitem" data-act="fileItem" data-idx="'+i+'" class="ap-menu__item"><span>'+f.label+'</span><span class="ap-mono" style="font-size:11px;color:var(--nb-muted)">'+f.kbd+'</span></button>').join(''); }
function toggleFileMenu(force){ const m=document.getElementById('filemenu'); const open=force!==undefined?force:m.style.display!=='block'; m.style.display=open?'block':'none'; document.getElementById('filebtn').setAttribute('aria-expanded',String(open)); }

// ---------- overlays (native <dialog>: focus stays inside, Escape closes, focus returns to the opener) ----------
let overState={quickAdd:false,search:false,quickAddType:'mobile',searchResults:[]};
function closeOverlays(){ overState.quickAdd=false; overState.search=false; const d=document.querySelector('#overlays dialog'); if(d&&d.open) d.close(); document.getElementById('overlays').innerHTML=''; }
function showDialog(html,cls,label){
  const box=document.getElementById('overlays');
  box.innerHTML='<dialog class="nb-dialog ap-dialog '+cls+'" aria-label="'+label+'">'+html+'</dialog>';
  const d=box.querySelector('dialog');
  d.addEventListener('close',()=>{ if(box.contains(d)) closeOverlays(); });
  // a click on the backdrop (outside the dialog's box) closes it
  d.addEventListener('click',e=>{ const r=d.getBoundingClientRect(); if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) closeOverlays(); });
  d.showModal();
  return d;
}
function openQuickAdd(){ closeOverlays(); toggleFileMenu(false); overState.quickAdd=true; overState.quickAddType='mobile';
  showDialog('<h2 class="nb-dialog__title" style="margin-bottom:var(--nb-space-4)">New product profile</h2>'
    +'<div class="nb-stack">'
    +'<div class="nb-field"><label class="nb-field__label" for="qaName">Name</label><input id="qaName" class="nb-input" placeholder="Product name…" autocomplete="off"></div>'
    +'<div class="nb-field"><span class="nb-field__label" id="qaTypeLabel">Type</span><div id="qaTypes" class="nb-segmented" role="radiogroup" aria-labelledby="qaTypeLabel"></div></div>'
    +'</div>'
    +'<div class="nb-dialog__actions"><button data-act="closeOverlays" class="nb-button nb-button--secondary">Cancel</button><button data-act="qaCommit" class="nb-button">Add product</button></div>',
    '','New product profile');
  renderQAtypes(); const inp=document.getElementById('qaName'); inp.focus();
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')commitQuickAdd();});
}
function renderQAtypes(){ document.getElementById('qaTypes').innerHTML=Object.keys(TYPES).map(k=>'<button role="radio" aria-checked="'+(overState.quickAddType===k)+'" data-act="qaType" data-type="'+k+'">'+TYPES[k]+'</button>').join(''); }
function commitQuickAdd(){ const name=(document.getElementById('qaName')||{}).value; if(!name||!name.trim())return; const id='p'+Date.now(); state.cols.push(blank(id,name.trim(),overState.quickAddType)); mut(); closeOverlays(); renderCols(); setTimeout(()=>jumpTo(id),100); }
function openSearch(){ closeOverlays(); toggleFileMenu(false); overState.search=true;
  showDialog('<input id="searchIn" class="nb-input ap-search-input" placeholder="Search products, ids, keywords…" aria-label="Search products" autocomplete="off"><div id="searchRes" class="ap-results"></div>','ap-dialog--search','Search products');
  const inp=document.getElementById('searchIn'); inp.focus(); renderSearch('');
  inp.addEventListener('input',e=>renderSearch(e.target.value));
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'&&overState.searchResults.length){ const id=overState.searchResults[0].id; closeOverlays(); jumpTo(id); } });
}
function renderSearch(q){ q=(q||'').trim().toLowerCase();
  overState.searchResults=state.cols.filter(c=>!q||(c.appName+' '+c.idsPrimary+' '+c.tagline+' '+c.keywords.join(' ')).toLowerCase().includes(q)).slice(0,8);
  const box=document.getElementById('searchRes'); if(!box)return;
  if(!overState.searchResults.length){ box.innerHTML='<div class="ap-empty">No matches</div>'; return; }
  box.innerHTML=overState.searchResults.map(c=>{const m=typeMeta(c.type);return '<button data-act="searchPick" data-col="'+c.id+'" class="ap-result"><div class="ap-avatar" style="width:32px;height:32px;border-radius:9px;font-size:14px;background:'+iconBg(c)+'" aria-hidden="true">'+esc((c.appName||'?').charAt(0).toUpperCase())+'</div><div class="ap-result__main"><strong>'+esc(c.appName)+'</strong><small>'+esc(c.idsPrimary||c.tagline)+'</small></div><span class="ap-result__type" style="color:'+(c.brandColors[0]||m.accent)+'">'+m.label+'</span></button>';}).join('');
}

// ---------- image slots ----------
function pickImage(id,sid){ slotTarget={id,sid}; document.getElementById('filepick').value=''; document.getElementById('filepick').click(); }
// dominant vibrant color of an image, for theming the column from its icon
function dominantColor(src,cb){
  const img=new Image();
  img.onload=()=>{ try{
    const n=24,cv=document.createElement('canvas'); cv.width=n; cv.height=n;
    const cx=cv.getContext('2d'); cx.drawImage(img,0,0,n,n);
    const d=cx.getImageData(0,0,n,n).data;
    let vr=0,vg=0,vb=0,vc=0, fr=0,fg=0,fb=0,fc=0; // vibrant vs fallback accumulators
    for(let i=0;i<d.length;i+=4){ const a=d[i+3]; if(a<128)continue; const r=d[i],g=d[i+1],b=d[i+2];
      const mx=Math.max(r,g,b),mn=Math.min(r,g,b),sat=mx?(mx-mn)/mx:0;
      if(sat>0.28&&mx>40&&mx<248){ vr+=r;vg+=g;vb+=b;vc++; } else { fr+=r;fg+=g;fb+=b;fc++; }
    }
    const use=vc>=3?[vr,vg,vb,vc]:(fc?[fr,fg,fb,fc]:null);
    if(!use){ cb(null); return; }
    const hex='#'+[use[0],use[1],use[2]].map(v=>Math.round(v/use[3]).toString(16).padStart(2,'0')).join('');
    cb(hex);
  }catch(e){ cb(null); } };
  img.onerror=()=>cb(null); img.src=src;
}
document.getElementById('filepick').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f||!slotTarget)return; const r=new FileReader(); r.onload=()=>{ const c=col(slotTarget.id); c.images=c.images||{}; c.images[slotTarget.sid]=r.result;
  if(slotTarget.sid===c.id+'-icon'){ dominantColor(r.result,hex=>{ if(hex){ if(!c.brandColors.length) c.brandColors=[hex]; else c.brandColors[0]=hex; } mut(); renderCols(); }); }
  else { mut(); renderCols(); }
}; r.readAsDataURL(f); });
document.getElementById('openpick').addEventListener('change',e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ loadBoard(JSON.parse(r.result)); fileHandle=null; document.getElementById('fileName').textContent=f.name; toast('Opened '+f.name); }catch(err){ toast('Invalid board file'); } }; r.readAsText(f); });

// ---------- event delegation ----------
document.addEventListener('click',e=>{
  if(slotMenuEl && !e.target.closest('#slotMenu')) closeSlotMenu();
  const el=e.target.closest('[data-act]');
  if(!el){ if(!e.target.closest('#filemenu')&&!e.target.closest('#filebtn')) toggleFileMenu(false); return; }
  const act=el.dataset.act, id=el.dataset.col, idx=+el.dataset.idx;
  switch(act){
    case 'mode': setMode(el.dataset.mode); return;
    case 'closeLightbox': closeLightbox(); return;
    case 'slotClick': if(state.mode==='view') openLightbox(id); else openSlotMenu(e.clientX,e.clientY,id,el.dataset.sid,el.dataset.icon==='1'); return;
    case 'slotReplace': closeSlotMenu(); pickImage(id,el.dataset.sid); return;
    case 'slotRemoveImg':{ const c=col(id); if(c.images) delete c.images[el.dataset.sid]; mut(); closeSlotMenu(); renderCols(); return; }
    case 'slotAddSlot': updateCol(id,{shots:[...col(id).shots,id+'-s'+Date.now()]}); closeSlotMenu(); renderCols(); return;
    case 'slotDelSlot':{ const c=col(id),sid=el.dataset.sid,ix=c.shots.indexOf(sid); if(ix>=0){ if(c.images) delete c.images[sid]; updateCol(id,{shots:c.shots.filter((_,j)=>j!==ix)}); } closeSlotMenu(); renderCols(); return; }
    case 'fileMenu': e.stopPropagation(); toggleFileMenu(); return;
    case 'fileItem': toggleFileMenu(false); FILE_ITEMS[+el.dataset.idx].fn(); return;
    case 'quickAdd': openQuickAdd(); return;
    case 'openSearch': openSearch(); return;
    case 'closeOverlays': closeOverlays(); return;
    case 'qaType': overState.quickAddType=el.dataset.type; renderQAtypes(); return;
    case 'qaCommit': commitQuickAdd(); return;
    case 'searchPick': closeOverlays(); jumpTo(id); return;
    case 'zoomIn': zoomAt(canvas.clientWidth/2,canvas.clientHeight/2,1.25); return;
    case 'zoomOut': zoomAt(canvas.clientWidth/2,canvas.clientHeight/2,0.8); return;
    case 'zoomFit': zoomFit(); return;
    case 'chipRemove': updateCol(id,{[el.dataset.field]:col(id)[el.dataset.field].filter((_,j)=>j!==idx)}); renderCols(); return;
    case 'altPromote':{ const c=col(id),alts=[...c.appNameAlts],chosen=alts.splice(idx,1)[0]; if(c.appName)alts.unshift(c.appName); updateCol(id,{appName:chosen,appNameAlts:alts}); renderCols(); return; }
    case 'altRemove': updateCol(id,{appNameAlts:col(id).appNameAlts.filter((_,j)=>j!==idx)}); renderCols(); return;
    case 'urlAdd': updateCol(id,{urls:[...col(id).urls,{label:'',url:''}]}); renderCols(); return;
    case 'urlRemove': updateCol(id,{urls:col(id).urls.filter((_,j)=>j!==idx)}); renderCols(); return;
    case 'colorAdd': if(col(id).brandColors.length<8){ updateCol(id,{brandColors:[...col(id).brandColors,'#4C7DE8']}); renderCols(); } return;
    case 'colorRemove': updateCol(id,{brandColors:col(id).brandColors.filter((_,j)=>j!==idx)}); renderCols(); return;
    case 'shotAdd': updateCol(id,{shots:[...col(id).shots,id+'-s'+Date.now()]}); renderCols(); return;
    case 'shotRemove': updateCol(id,{shots:col(id).shots.filter((_,j)=>j!==idx)}); renderCols(); return;
    case 'moveLeft':{ const i=state.cols.findIndex(c=>c.id===id); if(i>0){[state.cols[i-1],state.cols[i]]=[state.cols[i],state.cols[i-1]];mut();renderCols();} return; }
    case 'moveRight':{ const i=state.cols.findIndex(c=>c.id===id); if(i>=0&&i<state.cols.length-1){[state.cols[i+1],state.cols[i]]=[state.cols[i],state.cols[i+1]];mut();renderCols();} return; }
    case 'dupCol':{ const c=col(id),nid='p'+Date.now(),copy=JSON.parse(JSON.stringify(c)); copy.id=nid; copy.appName=c.appName+' copy'; copy.shots=copy.shots.map((_,i)=>nid+'-s'+(i+1)); copy.images={}; const i=state.cols.findIndex(x=>x.id===id); state.cols.splice(i+1,0,copy); mut(); renderCols(); toast('Column duplicated'); return; }
    case 'delCol': state.cols=state.cols.filter(c=>c.id!==id); mut(); renderCols(); toast('Column deleted'); return;
  }
});
// live text/select/color input (uncontrolled — no rerender, keeps focus)
document.addEventListener('input',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return; const act=el.dataset.act, id=el.dataset.col;
  if(act==='field'){ col(id)[el.dataset.field]=el.value; mut();
    if(el.dataset.field==='shortDesc'||el.dataset.field==='midDesc'){ const card=el.closest('.col-detail'); const sp=card&&card.querySelector('[data-count="'+el.dataset.field+'"]'); if(sp){ const max=+sp.dataset.max, r=cnt(el.value,max); sp.textContent=r.n+'/'+max; sp.className=r.cls; } }
  }else if(act==='urlField'){ col(id).urls[+el.dataset.idx][el.dataset.key]=el.value; mut(); }
  else if(act==='colorField'){ const v=el.value.toUpperCase(); col(id).brandColors[+el.dataset.idx]=v; mut(); const it=el.closest('[data-coloritem]'),hx=it&&it.querySelector('.hex-field'); if(hx)hx.value=v; }
  else if(act==='hexField'){ let v=el.value.trim(); if(v&&v[0]!=='#')v='#'+v; if(/^#[0-9a-fA-F]{6}$/.test(v)){ v=v.toUpperCase(); col(id).brandColors[+el.dataset.idx]=v; mut(); const it=el.closest('[data-coloritem]'),sw=it&&it.querySelector('.brand-color'); if(sw)sw.value=v; } }
});
// commit color edits: normalize + re-render so accent/hex sync (invalid hex reverts to model)
document.addEventListener('change',e=>{ const el=e.target.closest('[data-act]'); if(!el)return; if(el.dataset.act==='colorField'||el.dataset.act==='hexField') renderCols(); });
// Enter-to-add on chip/alt inputs
document.addEventListener('keydown',e=>{
  const el=e.target.closest('[data-act]'); if(!el||e.key!=='Enter')return; const act=el.dataset.act, id=el.dataset.col;
  if(act==='chipAdd'){ const v=el.value.trim(); if(!v)return; const f=el.dataset.field; updateCol(id,{[f]:[...col(id)[f],v]}); renderCols(); setTimeout(()=>{const n=document.querySelector('[data-act="chipAdd"][data-col="'+id+'"][data-field="'+f+'"]');n&&n.focus();},0); }
  else if(act==='altAdd'){ const v=el.value.trim(); if(!v)return; updateCol(id,{appNameAlts:[...col(id).appNameAlts,v]}); renderCols(); setTimeout(()=>{const n=document.querySelector('[data-act="altAdd"][data-col="'+id+'"]');n&&n.focus();},0); }
});

// ---------- canvas pan / zoom ----------
const canvas=document.getElementById('canvas');
canvas.addEventListener('wheel',e=>{ e.preventDefault(); if(e.ctrlKey||e.metaKey){ const rect=canvas.getBoundingClientRect(); zoomAt(e.clientX-rect.left,e.clientY-rect.top,Math.exp(-e.deltaY*0.0022)); } else { state.panX-=e.deltaX; state.panY-=e.deltaY; applyView(); } },{passive:false});
canvas.addEventListener('mousedown',e=>{
  if(e.button===1||spaceDown||!e.target.closest('[data-nopan]')){
    e.preventDefault(); const sx=e.clientX,sy=e.clientY,px=state.panX,py=state.panY; canvas.style.cursor='grabbing'; toggleFileMenu(false);
    const mv=ev=>{state.panX=px+ev.clientX-sx;state.panY=py+ev.clientY-sy;applyView();};
    const up=()=>{canvas.style.cursor=spaceDown?'grab':'default';window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);};
    window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
  }
});

// ---------- global keys ----------
window.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable;
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='s'){ e.preventDefault(); e.shiftKey?saveAs():save(); return; }
  if(mod&&e.key.toLowerCase()==='o'){ e.preventDefault(); openFile(); return; }
  if(mod&&e.key.toLowerCase()==='k'){ e.preventDefault(); overState.search?closeOverlays():openSearch(); return; }
  if(e.key==='Escape'){ closeOverlays(); toggleFileMenu(false); closeLightbox(); closeSlotMenu(); return; }
  if(typing)return;
  if(e.key===' '){ spaceDown=true; canvas.style.cursor='grab'; e.preventDefault(); return; }
  if(e.key.toLowerCase()==='n'){ e.preventDefault(); openQuickAdd(); }
});
window.addEventListener('keyup',e=>{ if(e.key===' '){ spaceDown=false; canvas.style.cursor='default'; } });

// ---------- drag file to open ----------
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(!f)return; if(/\.(appboard|json)$/i.test(f.name)){ const r=new FileReader(); r.onload=()=>{ try{ loadBoard(JSON.parse(r.result)); fileHandle=null; document.getElementById('fileName').textContent=f.name; toast('Opened '+f.name); }catch(err){ toast('Invalid board file'); } }; r.readAsText(f); } });
window.addEventListener('beforeunload',e=>{ if(state.dirty){ e.preventDefault(); e.returnValue=''; } });

// ---------- boot ----------
renderFileMenu();
updateModeUI();
renderCols();
setTimeout(zoomFit,60);
loadSaved();
</script>
